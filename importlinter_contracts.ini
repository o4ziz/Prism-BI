# Prism BI — package boundary fitness functions

[importlinter]
root_packages =
    prism_bi
    prism_bi_sdk
include_external_packages = True

[importlinter:contract:sdk-independence]
name = prism_bi_sdk must not depend on the host package
type = forbidden
source_modules =
    prism_bi_sdk
forbidden_modules =
    prism_bi

[importlinter:contract:domain-independence]
name = domain must not depend on infrastructure or presentation
type = forbidden
source_modules =
    prism_bi.domain
forbidden_modules =
    prism_bi.infrastructure
    prism_bi.presentation
    prism_bi.bootstrap
    PySide6
    duckdb

[importlinter:contract:application-independence]
name = application must not depend on presentation or infrastructure
type = forbidden
source_modules =
    prism_bi.application
forbidden_modules =
    prism_bi.presentation
    prism_bi.infrastructure
    prism_bi.bootstrap
    PySide6
