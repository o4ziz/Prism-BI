name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check src tests plugins

      - name: Ruff format check
        run: uv run ruff format --check src tests plugins

      - name: Mypy
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports --config importlinter_contracts.ini

      - name: Pytest
        run: uv run pytest
