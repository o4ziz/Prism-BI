# Default system configuration for Prism BI.

[app]
name = "Prism BI"
log_level = "INFO"

[paths]
# Relative paths resolved against user data dir at runtime when empty.
plugin_dirs = []

[performance]
preview_rows = 200
import_chunk_rows = 50000
grid_window_rows = 500
chart_max_points = 10000
memory_budget_mb = 4096

[logging]
max_bytes = 10485760
backup_count = 5

[features]
ai_enabled = false

[plugins]
# Soft-fail incompatible or broken plugins so the host remains usable.
continue_on_error = true
required_api_major = 1
